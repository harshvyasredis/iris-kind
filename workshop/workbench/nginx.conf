events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /docs/ {
            proxy_pass http://127.0.0.1:8081/;
            include /etc/nginx/proxy/proxy-params.conf;
        }

        location /vscode/ {
            proxy_pass http://127.0.0.1:8080/;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }

        location /app/ {
            proxy_pass http://127.0.0.1:3000;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }

        location /terminal/ {
            proxy_pass http://127.0.0.1:7681/;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }

        # Preserve /redisinsight prefix; Insight is configured with RI_PROXY_PATH.
        location /redisinsight/ {
            proxy_pass http://redisinsight.rec.svc.cluster.local:5540;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
            include /etc/nginx/proxy/proxy-params-long-running.conf;
        }
    }
}
